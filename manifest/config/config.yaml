# GRPC Server.
grpc:
  address: ":8003"
  name: "jh_balance_service"
  logPath: ""
  logStdout: true
  errorStack: true
  errorLogEnabled: true
  errorLogPattern: "error-{Ymd}.log"
  accessLogEnabled: true
  accessLogPattern: "access-{Ymd}.log"

# Consul 配置
consul:
  addr: "consul:8500" # 容器内直接访问Consul
  serviceName: "jh_balance_service"
  servicePort: 8003
  serviceAddr: "" # 留空，让程序自动获取容器IP

# Jaeger 配置
jaeger:
  endpoint: "jaeger:4317" # Jaeger OTLP gRPC 端点
  serviceName: "jh_balance_service" # 服务名称
  serviceVersion: "1.0.0" # 服务版本
  environment: "development" # 环境
  enabled: true # 是否启用追踪

# JWT 配置
jwt:
  secret: "be0axSSXmguDZ2Q0EIPgRwq9e5G9nRH3zq3iEw6nllU="

# MinIO 配置
minio:
  endpoint: "minio:9000" # MinIO 服务地址
  accessKey: "minioadmin" # 访问密钥
  secretKey: "minioadmin123" # 秘密密钥
  bucket: "uploads" # 存储桶名称
  useSSL: false # 是否使用SSL
  publicURL: "https://jh-minio.panalow.cc" # 公网访问地址

# 上传配置
upload:
  default:
    imgType:
      - "image/jpg"
      - "image/jpeg"
      - "image/gif"
      - "image/png"
    maxSize: 2048 # KB (2MB)
  mobile_logo:
    imgType:
      - "image/svg+xml"
    maxSize: 100 # KB

# Global logging - JSON格式
logger:
  level: "all"
  stdout: true
  # 使用JSON格式输出
  format: "json"
  # 时间格式
  timeFormat: "2006-01-02T15:04:05.000Z07:00"

# 时区配置
timezone: "Asia/Shanghai" # 北京时间

# ClickHouse 配置
clickhouse:
  host: "clickhouse" # ClickHouse服务地址
  port: 9000 # ClickHouse原生协议端口（9000）
  database: "game_analytics" # 数据库名称
  username: "default" # 用户名
  password: "123456" # 密码

# Redis 配置
redis:
  default:
    address: redis:6379
    db: 1
    pass: 654321

# Database.
database:
  logger:
    level: "all"
    stdout: true

  default:
    link: "mysql:root:654321@tcp(mysql:3306)/jh_balance?parseTime=true&loc=Local" # 容器内直接访问MySQL
    debug: true

# RabbitMQ 配置
rabbitmq:
  url: "amqp://admin:admin123@rabbitmq:5672/" # RabbitMQ连接地址

# 支付配置
payment:
  mg:
    # MG 充值回调验签开关。
    # ⚠️ 默认 false：当前网关仅透传 trade_status/order_sn/actual_amount 三个字段，
    #    若 MG 平台实际参与签名的字段集合与此不同，开启后所有真实回调都会验签失败，
    #    导致「用户已付款但不入账」。金额比对(actual_amount<=订单金额)始终生效，与本开关无关。
    # ✅ 启用前置条件：核对 MG 接入文档确认签名字段集合，必要时在网关侧补齐原始回调参数，
    #    联调确认真实回调能通过验签后再改为 true。开启后 B1（回调可伪造入账）才算真正闭环。
    verifyCallback: false
