syntax = "proto3";

package balance;

option go_package = "jh_balance_service/api/backend/balance/v1";

service Balance {
    // 账变记录相关
    rpc GetBalanceChanges(GetBalanceChangesReq) returns (GetBalanceChangesRes) {}
    
    // 活动彩金发放记录
    rpc GetLuckyBonusRecords(GetLuckyBonusRecordsReq) returns (GetLuckyBonusRecordsRes) {}
    rpc GetDepositBonusRecords(GetDepositBonusRecordsReq) returns (GetDepositBonusRecordsRes) {}
    rpc GetRegisterBonusRecords(GetRegisterBonusRecordsReq) returns (GetRegisterBonusRecordsRes) {}
    rpc GetInviteBonusRecords(GetInviteBonusRecordsReq) returns (GetInviteBonusRecordsRes) {}
    rpc GetSigninBonusRecords(GetSigninBonusRecordsReq) returns (GetSigninBonusRecordsRes) {}
    
    // 交易类型选项
    rpc GetChangeList(GetChangeListReq) returns (GetChangeListRes) {}
    
    // 充值记录相关
    rpc GetRechargePayments(GetRechargePaymentsReq) returns (GetRechargePaymentsRes) {}
    rpc GetRechargeManuals(GetRechargeManualsReq) returns (GetRechargeManualsRes) {}
    rpc ConfirmPaymentOrder(ConfirmPaymentOrderReq) returns (ConfirmPaymentOrderRes) {}
    
    // 提现记录相关
    rpc GetWithdraws(GetWithdrawsReq) returns (GetWithdrawsRes) {}
    rpc GetWithdrawManuals(GetWithdrawManualsReq) returns (GetWithdrawManualsRes) {}
    rpc GetWithdrawReview(GetWithdrawReviewReq) returns (GetWithdrawReviewRes) {}
    rpc DealWithWithdraw(DealWithWithdrawReq) returns (DealWithWithdrawRes) {}
    
    // 余额查询和操作相关
    rpc QueryUserBalance(QueryUserBalanceReq) returns (QueryUserBalanceRes) {}
    rpc QueryGameBalance(QueryGameBalanceReq) returns (QueryGameBalanceRes) {}
    rpc ManualUserBalance(ManualUserBalanceReq) returns (ManualUserBalanceRes) {}
    
    // 站点支付管理相关
    rpc GetSitePayments(GetSitePaymentsReq) returns (GetSitePaymentsRes) {}
    rpc UpdateSitePayment(UpdateSitePaymentReq) returns (UpdateSitePaymentRes) {}
    
    // 站点提现管理相关
    rpc GetSiteWithdraws(GetSiteWithdrawsReq) returns (GetSiteWithdrawsRes) {}
    rpc UpdateSiteWithdraw(UpdateSiteWithdrawReq) returns (UpdateSiteWithdrawRes) {}
    
    // 操作类型选项
    rpc GetManualList(GetManualListReq) returns (GetManualListRes) {}

    // 流水规则管理
    rpc GetFlowRules(GetFlowRulesReq) returns (GetFlowRulesRes) {}
    rpc GetFlowRule(GetFlowRuleReq) returns (GetFlowRuleRes) {}
    rpc CreateFlowRule(CreateFlowRuleReq) returns (CreateFlowRuleRes) {}
    rpc UpdateFlowRule(UpdateFlowRuleReq) returns (UpdateFlowRuleRes) {}
    rpc DeleteFlowRule(DeleteFlowRuleReq) returns (DeleteFlowRuleRes) {}
    // 流水规则类型选项
    rpc GetFlowOptions(GetFlowOptionsReq) returns (GetFlowOptionsRes) {}

    // 流水要求管理
    rpc GetFlowRequirements(GetFlowRequirementsReq) returns (GetFlowRequirementsRes) {}
    rpc UpdateFlowRequirement(UpdateFlowRequirementReq) returns (UpdateFlowRequirementRes) {}
}

// 获取流水规则类型选项请求
message GetFlowOptionsReq {}

// 流水规则类型选项
message FlowOptionItem {
    int32 value = 1;
    string label = 2;
}

// 获取流水规则类型选项响应
message GetFlowOptionsRes {
    repeated FlowOptionItem list = 1;
}

// 获取交易类型列表请求
message GetChangeListReq {
}

// 获取交易类型列表响应
message GetChangeListRes {
    map<int32, string> list = 1;
}

// 获取账变记录请求
message GetBalanceChangesReq {
    string username = 1;        // 用户名 (可选)
    int32 change_type = 2;      // 账变类型 1=入款 2=出款 (可选)
    int32 trade_type = 3;       // 交易类型 (可选)
    string start_time = 4;      // 开始时间 (可选)
    string end_time = 5;        // 结束时间 (可选)
    int32 page = 6;             // 页码
    int32 size = 7;             // 每页数量
}

// 账变记录信息
message BalanceChangeInfo {
    int32 id = 1;                       // ID
    int32 trade_type = 2;               // 交易类型
    string trade_type_name = 3;         // 交易类型名称
    int32 user_id = 4;                  // 用户ID
    string username = 5;                // 用户名
    string trade_no = 6;                // 流水号
    double balance_old = 7;             // 旧余额
    double money = 8;                   // 变动金额
    double balance_new = 9;             // 新余额
    double balance_frozen = 10;         // 冻结余额
    int32 status = 11;                  // 状态
    string status_name = 12;            // 状态名称
    string remark = 13;                 // 备注
    string created_at = 14;             // 创建时间
    int32 change_type = 15;             // 账变类型 1=入款 2=出款
}

// 获取账变记录响应
message GetBalanceChangesRes {
    repeated BalanceChangeInfo list = 1; // 账变记录列表
    int32 count = 2;                     // 总数量
}

// 获取大转盘活动发放记录请求
message GetLuckyBonusRecordsReq {
    int32 user_id = 1;     // 用户ID (可选)
    string username = 2;   // 用户名 (可选)
    string trade_no = 3;   // 流水号 (可选)
    string start_time = 4; // 开始时间 (可选)
    string end_time = 5;   // 结束时间 (可选)
    int32 page = 6;        // 页码
    int32 size = 7;        // 每页数量
    int32 site_id = 8;     // 站点ID (可选)
}

// 大转盘活动发放记录
message LuckyBonusRecord {
    int64 id = 1;           // ID
    int32 user_id = 2;      // 用户ID
    string username = 3;    // 用户名
    string date = 4;        // 活动日期(yyyy-mm-dd)
    int32 segment_no = 5;   // 大转盘扇区
    string prize_name = 6;  // 大转盘奖项
    double reward_amount = 7; // 发放金额
    string trade_no = 8;    // 发放流水号/订单号
    string created_at = 9;  // 发放时间
}

// 获取大转盘活动发放记录响应
message GetLuckyBonusRecordsRes {
    repeated LuckyBonusRecord list = 1; // 发放记录列表
    int32 count = 2;                    // 总数量
}

// 获取充值送活动发放记录请求
message GetDepositBonusRecordsReq {
    int32 user_id = 1;     // 用户ID (可选)
    string username = 2;   // 用户名 (可选)
    string trade_no = 3;   // 流水号 (可选)
    string start_time = 4; // 开始时间 (可选)
    string end_time = 5;   // 结束时间 (可选)
    int32 page = 6;        // 页码
    int32 size = 7;        // 每页数量
    int32 site_id = 8;     // 站点ID (可选)
}

// 充值送活动发放记录
message DepositBonusRecord {
