}

// 获取充值送活动发放记录响应
message GetDepositBonusRecordsRes {
    repeated DepositBonusRecord list = 1; // 发放记录列表
    int32 count = 2;                      // 总数量
}

// 获取注册送活动发放记录请求
message GetRegisterBonusRecordsReq {
    int32 user_id = 1;     // 用户ID (可选)
    string username = 2;   // 用户名 (可选)
    string trade_no = 3;   // 流水号 (可选)
    string start_time = 4; // 开始时间 (可选)
    string end_time = 5;   // 结束时间 (可选)
    int32 page = 6;        // 页码
    int32 size = 7;        // 每页数量
    int32 site_id = 8;     // 站点ID (可选)
