// 获取邀请朋友活动发放记录请求
message GetInviteBonusRecordsReq {
    int32 inviter_id = 1;        // 邀请人ID (可选)
    string inviter_username = 2; // 邀请人用户名 (可选)
    int32 invitee_id = 3;        // 被邀请人ID (可选)
    string invitee_username = 4; // 被邀请人用户名 (可选)
    string trade_no = 5;         // 流水号 (可选)
    string start_time = 6;       // 开始时间 (可选)
    string end_time = 7;         // 结束时间 (可选)
    int32 page = 8;              // 页码
    int32 size = 9;              // 每页数量
    int32 site_id = 10;          // 站点ID (可选)
}

// 邀请朋友活动发放记录
message InviteBonusRecord {
    int64 id = 1;           // ID
    int32 inviter_id = 2;   // 邀请人ID
    string inviter_name = 3; // 邀请人用户名
    int32 invitee_id = 4;   // 被邀请人ID
    string invitee_name = 5; // 被邀请人用户名
    string date = 6;        // 活动日期(yyyy-mm-dd)
    double bonus_amount = 7; // 发放金额
    string trade_no = 8;    // 发放流水号/订单号
    string created_at = 9;  // 发放时间
}

// 获取邀请朋友活动发放记录响应
message GetInviteBonusRecordsRes {
    repeated InviteBonusRecord list = 1; // 发放记录列表
    int32 count = 2;                     // 总数量
}

// 获取每日签到活动发放记录请求
message GetSigninBonusRecordsReq {
    int32 user_id = 1;     // 用户ID (可选)
    string username = 2;   // 用户名 (可选)
    string trade_no = 3;   // 流水号 (可选)
    string start_time = 4; // 开始时间 (可选)
    string end_time = 5;   // 结束时间 (可选)
    int32 page = 6;        // 页码
    int32 size = 7;        // 每页数量
    int32 site_id = 8;     // 站点ID (可选)
}

// 每日签到活动发放记录
message SigninBonusRecord {
    int64 id = 1;          // ID
    int32 user_id = 2;     // 用户ID
    string username = 3;   // 用户名
    string date = 4;       // 活动日期(yyyy-mm-dd)
    int32 day_no = 5;      // 签到日号(1-31)
    double bonus_amount = 6; // 发放金额
    string trade_no = 7;   // 发放流水号/订单号
    string created_at = 8; // 发放时间
}

// 获取每日签到活动发放记录响应
message GetSigninBonusRecordsRes {
    repeated SigninBonusRecord list = 1; // 发放记录列表
    int32 count = 2;                     // 总数量
}

// 获取充值记录请求
message GetRechargePaymentsReq {
    string username = 1;        // 用户名 (可选)
    int32 gateway = 2;          // 网关类型 (可选)
    int32 payment_id = 3;       // 支付ID (可选)
    int32 account_id = 4;       // 账号ID (可选)
    int32 status = 5;           // 状态 (可选)
    string trade_no = 6;        // 流水号 (可选)
    string domain = 7;          // 域名 (可选)
    string start_time = 8;      // 开始时间 (可选)
    string end_time = 9;        // 结束时间 (可选)
    int32 page = 10;            // 页码
    int32 size = 11;            // 每页数量
}

// 充值记录信息
message RechargePaymentInfo {
    int64 id = 1;                       // ID
    int32 user_id = 2;                  // 用户ID
    string username = 3;                // 用户名
    int32 activity_recharge_id = 4;     // 充值活动ID
    int32 gateway = 5;                  // 网关类型
    string gateway_name = 6;            // 网关名称
    int32 payment_id = 7;               // 支付ID
    string payment_name = 8;            // 支付名称
    int32 payment_account_id = 9;       // 支付账号ID
    string bank_value = 10;             // 银行代码
    string trade_no = 11;               // 流水号
    double money = 12;                  // 充值金额
    double fee = 13;                    // 手续费
    int32 status = 14;                  // 状态
    string status_name = 15;            // 状态名称
    int32 admin_id = 16;                // 管理员ID
    string admin_name = 17;             // 管理员名称
    string remark = 18;                 // 备注
    string created_at = 19;             // 创建时间
    string updated_at = 20;             // 更新时间
}

// 获取充值记录响应
message GetRechargePaymentsRes {
    repeated RechargePaymentInfo list = 1; // 充值记录列表
    int32 count = 2;                       // 总数量
}

// 获取后台加款记录请求
message GetRechargeManualsReq {
    string username = 1;        // 用户名 (可选)
    int32 status = 2;           // 状态 (可选)
    string start_time = 3;      // 开始时间 (可选)
    string end_time = 4;        // 结束时间 (可选)
    int32 page = 5;             // 页码
    int32 size = 6;             // 每页数量
}

// 后台加款记录信息
message RechargeManualInfo {
    int64 id = 1;                       // ID
    int32 user_id = 2;                  // 用户ID
    string username = 3;                // 用户名
    string trade_no = 4;                // 流水号
    double money = 5;                   // 加款金额
    int32 status = 6;                   // 状态
    string status_name = 7;             // 状态名称
    int32 admin_id = 8;                 // 管理员ID
    string admin_name = 9;              // 管理员名称
    string remark = 10;                 // 备注
    string created_at = 11;             // 创建时间
}

// 获取后台加款记录响应
message GetRechargeManualsRes {
    repeated RechargeManualInfo list = 1; // 后台加款记录列表
    int32 count = 2;                      // 总数量
}

// 确认支付订单请求
message ConfirmPaymentOrderReq {
    int64 id = 1;               // 订单ID
    string remark = 2;          // 备注 (可选)
}

// 确认支付订单响应
message ConfirmPaymentOrderRes {
    bool success = 1;           // 是否成功
    string message = 2;         // 响应消息
}

// 获取提现记录请求
message GetWithdrawsReq {
    string username = 1;        // 用户名 (可选)
    int32 status = 2;           // 状态 (可选)
    string trade_no = 3;        // 流水号 (可选)
    string domain = 4;          // 域名 (可选)
    string start_time = 5;      // 开始时间 (可选)
    string end_time = 6;        // 结束时间 (可选)
    int32 page = 7;             // 页码
    int32 size = 8;             // 每页数量
}

// 提现记录信息
message WithdrawInfo {
    int64 id = 1;                       // ID
    int32 user_id = 2;                  // 用户ID
    int32 user_level_id = 3;            // 用户层级ID
    string username = 4;                // 用户名
    string trade_no = 5;                // 流水号
    double money = 6;                   // 提现金额
    double fee = 7;                     // 手续费
    string bank_name = 8;               // 银行名称
    string card_account = 9;            // 银行户名
    string card_no = 10;                // 卡号
    string deposit_bank = 11;           // 开户行
    int32 status = 12;                  // 状态
    string status_name = 13;            // 状态名称
    int32 admin_id = 14;                // 管理员ID
    string admin_name = 15;             // 管理员名称
    string remark = 16;                 // 备注
    string created_at = 17;             // 创建时间
    string updated_at = 18;             // 更新时间
}

// 获取提现记录响应
message GetWithdrawsRes {
    repeated WithdrawInfo list = 1;     // 提现记录列表
    int32 count = 2;                    // 总数量
}

// 获取后台提现记录请求
message GetWithdrawManualsReq {
    string username = 1;        // 用户名 (可选)
    int32 status = 2;           // 状态 (可选)
    string start_time = 3;      // 开始时间 (可选)
    string end_time = 4;        // 结束时间 (可选)
    int32 page = 5;             // 页码
    int32 size = 6;             // 每页数量
}

// 后台提现记录信息
message WithdrawManualInfo {
    int64 id = 1;                       // ID
    int32 user_id = 2;                  // 用户ID
    string username = 3;                // 用户名
    string trade_no = 4;                // 流水号
    double money = 5;                   // 提现金额
    int32 status = 6;                   // 状态
    string status_name = 7;             // 状态名称
    int32 admin_id = 8;                 // 管理员ID
    string admin_name = 9;              // 管理员名称
    string remark = 10;                 // 备注
    string created_at = 11;             // 创建时间
}

// 获取后台提现记录响应
message GetWithdrawManualsRes {
    repeated WithdrawManualInfo list = 1; // 后台提现记录列表
    int32 count = 2;                      // 总数量
}

// 获取提现审核信息请求
message GetWithdrawReviewReq {
    int64 id = 1;               // 提现记录ID
}

// 提现审核信息
message WithdrawReviewInfo {
    // ========== 第一块：提现核心信息 ==========
    int32 user_id = 1;                  // 用户ID
    string username = 2;                // 用户名
    double withdraw_amount = 3;         // 本次提现金额
    string bank_card_masked = 4;        // 银行卡（脱敏）
    string apply_time = 5;              // 申请时间
    double current_balance = 6;         // 当前余额
    double frozen_balance = 7;          // 冻结余额
    
    // ========== 第二块：资金合规与流水 ==========
    double total_recharge = 8;          // 总充值
    double valid_bet = 9;               // 有效投注
    double required_flow = 10;          // 所需流水
    double remaining_flow = 11;         // 还需流水
    double today_recharge = 12;         // 今日充值
    double today_withdraw = 13;         // 今日提现
    
    // ========== 第三块：风险信息 ==========
    string register_time = 14;          // 注册时间
    string register_ip = 15;            // 注册IP
    int32 vip_level = 16;               // VIP等级
    int32 total_withdraw_count = 17;    // 总提现次数
    double total_win_lose = 18;         // 总输赢
    double total_bet_multiple = 19;     // 总打码倍数
    
    // ========== 其他信息（用于后续处理） ==========
    int64 withdraw_id = 20;             // 提现记录ID
    string trade_no = 21;               // 流水号
    string bank_name = 22;              // 银行名称
    string card_account = 23;           // 银行户名
    string card_no = 24;                // 完整卡号（仅后台使用）
    string deposit_bank = 25;           // 开户行
    int32 status = 26;                  // 状态
    double fee = 27;                    // 手续费
    string remark = 28;                 // 备注
}

// 获取提现审核信息响应
message GetWithdrawReviewRes {
    WithdrawReviewInfo data = 1;        // 审核信息
}

// 处理提现请求
message DealWithWithdrawReq {
    int64 id = 1;               // 提现记录ID
    int32 type = 2;             // 处理类型 1=确认 0=拒绝 2=补单
    double fee = 3;             // 手续费 (可选)
    string remark = 4;          // 备注 (可选)
}

// 处理提现响应
message DealWithWithdrawRes {
    bool success = 1;           // 是否成功
    string message = 2;         // 响应消息
}
// 查询用户余额请求
message QueryUserBalanceReq {
    int32 user_id = 1;        // 用户名
}

// 用户余额信息
message UserBalanceInfo {
    int32 user_id = 1;                  // 用户ID
    string username = 2;                // 用户名
    double balance = 3;                 // 可用余额
    double balance_frozen = 4;          // 冻结余额
    double points = 5;                  // 积分
    string last_update_time = 6;        // 最后更新时间
}

// 查询用户余额响应
message QueryUserBalanceRes {
    UserBalanceInfo data = 1;           // 用户余额信息
}

// 查询游戏余额请求
message QueryGameBalanceReq {
    int32 game_id = 1;          // 游戏ID
    int32 user_id = 2;          // 用户ID
}

// 游戏余额信息
message GameBalanceInfo {
    int32 game_id = 1;                  // 游戏ID
    string game_name = 2;               // 游戏名称
    int32 user_id = 3;                  // 用户ID
    string username = 4;                // 用户名
    double balance = 5;                 // 游戏余额
    string last_update_time = 6;        // 最后更新时间
}

// 查询游戏余额响应
message QueryGameBalanceRes {
    GameBalanceInfo data = 1;           // 游戏余额信息
}

// 手动操作用户余额请求
message ManualUserBalanceReq {
    int32 user_id = 1;          // 用户ID
    int32 type = 2;             // 操作类型 1=加款 2=扣款
    double money = 3;           // 操作金额
    string remark = 4;          // 备注
}

// 手动操作用户余额响应
message ManualUserBalanceRes {
    bool success = 1;           // 是否成功
    string message = 2;         // 响应消息
    double balance_old = 3;     // 操作前余额
    double balance_new = 4;     // 操作后余额
}

// 获取操作类型列表请求
message GetManualListReq {
}

// 获取操作类型列表响应
message GetManualListRes {
    map<int32, string> list = 1;  // 操作类型列表
}

// 获取流水规则列表请求
message GetFlowRulesReq {
    int32 site_id = 1;        // 站点ID（可选）
    int32 rule_type = 2;      // 规则类型（可选）
    int32 status = 3;         // 状态（可选）
    string rule_name = 4;     // 规则名称（模糊搜索，可选）
    int32 page = 5;           // 页码
    int32 size = 6;           // 每页数量
}

// 流水规则信息
message FlowRuleInfo {
    int32 id = 1;             // 主键ID
    int32 site_id = 2;        // 站点ID
    string rule_name = 3;     // 规则名称
    int32 rule_type = 4;      // 规则类型
    double flow_multiple = 5; // 默认流水倍数
    int32 expire_days = 6;    // 有效天数（0表示永久）
    int32 status = 7;         // 状态
    int32 sort = 8;           // 排序
