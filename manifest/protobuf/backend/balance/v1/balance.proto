    int32 user_id = 2;     // 用户ID
    string username = 3;   // 用户名
    string date = 4;       // 活动日期(yyyy-mm-dd)
    double bonus_amount = 5; // 发放金额
    string trade_no = 6;   // 发放流水号/订单号
