syntax = "proto3";

package front_game;

option go_package = "jh_balance_service/api/grpc/game/frontend/v1";

service Game {
    rpc RedirectToGame(RedirectToGameReq) returns (RedirectToGameRes) {}
    rpc GetGameCategories(GetGameCategoriesReq) returns (GetGameCategoriesRes) {}
    rpc GetGameList(GetGameListReq) returns (GetGameListRes) {}
    rpc GetGameBalance(GetGameBalanceReq) returns (GetGameBalanceRes) {}
    rpc RecallGameBalance(RecallGameBalanceReq) returns (RecallGameBalanceRes) {}
}

message RedirectToGameReq {
    int32 game_id = 1;             // 游戏ID
    string key = 2;                // 电子游戏专用
    int32 mobile = 3;                // 电子游戏专用
}

message RedirectToGameRes {
    string type = 1;                   // 类型
    string url = 2;                    // 游戏跳转链接
}

message GetGameCategoriesReq {
    int32 type = 1;                // 游戏类型（可选）
}

message GetGameCategoriesRes {
    repeated GameCategory categories = 1;  // 游戏种类列表
}

message GameCategory {
    int32 game_id = 1;             // 游戏ID
    string name = 2;               // 游戏名称
    string platform = 3;           // 平台
    int32 type = 4;                // 游戏类型
    string image_code = 5;         // 图片代码
    string db_name = 6;            // 数据库名称
    int32 sort = 7;                // 排序
    int32 status = 8;              // 状态
}

message GetGameListReq {
    string platform = 1;           // 平台（可选）ONE、IG_JILI
    int32 hot = 2;                 // 是否热门（可选）-1=全部 0=否 1=是
    int32 is_new = 3;              // 是否新游戏（可选）-1=全部 0=否 1=是
    int32 recommend = 4;           // 是否推荐（可选）-1=全部 0=否 1=是
    int32 page = 5;                // 页码
    int32 size = 6;                // 每页数量
}

message GetGameListRes {
    repeated GameItem list = 1;    // 游戏列表
    int32 total = 2;               // 总数
}

message GameItem {
    int32 id = 1;                  // ID
    int32 site_id = 2;             // 站点ID
    string platform = 3;           // 平台
    string vendor = 4;             // 运营商
    string code = 5;               // 游戏代码
    string name = 6;               // 游戏名称
    string style = 7;              // 游戏类型
    string img = 8;                // 图片
    string img1 = 9;               // 图片1
    int32 hot = 10;                // 是否热门
    int32 recommend = 11;          // 是否推荐
    int32 is_new = 12;             // 是否新游戏
    int32 status = 13;             // 状态
    int32 sort = 14;               // 排序
    int32 game_id = 15;            // 游戏ID（从site_game表获取）
}

message GetGameBalanceReq {
    int32 game_id = 1;             // 游戏ID
}

message GetGameBalanceRes {
    double balance = 1;            // 游戏余额（使用double保持精度）
    bool success = 2;              // 是否成功
    string message = 3;            // 消息
}

message RecallGameBalanceReq {
}

message RecallGameBalanceRes {
    bool success = 1;              // 是否成功
    string message = 2;            // 消息
    double recalled_amount = 3;    // 回收的金额（使用double保持精度）
    int32 game_id = 4;             // 回收的游戏ID
    string game_name = 5;          // 回收的游戏名称
}